<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why Swallowtail | Thomas Y.L. Lin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="robots" content="noindex">
    <meta name="description" content="The swallowtail potential of multiphysics control: the steady state of an electro-thermo-optic device as an A4 catastrophe unfolded by three physical knobs.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <style>
        :root {
            --bg: #0b0b0e;
            --ink: #f2f2f0;
            --body: #a3a3ab;
            --faint: #74747d;
            --line: rgba(255, 255, 255, 0.16);
            --hair: rgba(255, 255, 255, 0.08);
            --sand: #f4cf98;
            --card: #141417;
        }

        * { box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: var(--ink);
            background-color: #0b0b0e;
            /* Same Rama-style diagonal hatch as the portfolio. */
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18'><path d='M5 13 L13 5' stroke='%23ffffff' stroke-opacity='0.05' stroke-width='1'/></svg>");
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }
        img { max-width: 100%; }

        /* ---------- Chrome ---------- */
        .nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            border-bottom: 1px solid var(--hair);
        }
        .nav-inner {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .nav-inner a {
            font-family: 'Martian Mono', monospace;
            font-size: 10.5px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--ink);
            opacity: 0.85;
            transition: opacity 0.15s ease;
        }
        .nav-inner a:hover { opacity: 1; }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 56px 24px 120px;
        }

        /* ---------- Document body ---------- */
        article { color: var(--body); }

        article h1, article h2, article h3 {
            color: var(--ink);
            font-weight: 500;
            line-height: 1.14;
            letter-spacing: -0.03em;
        }
        article h1 {
            font-size: clamp(2rem, 5vw, 2.9rem);
            margin: 0 0 22px;
        }
        article h2 {
            font-size: clamp(1.2rem, 2.6vw, 1.5rem);
            margin: 68px 0 20px;
            padding-top: 26px;
            border-top: 1px solid var(--hair);
        }
        article h3 { font-size: 1.15rem; margin: 40px 0 14px; }

        article p { margin: 0 0 18px; }
        article strong { color: var(--ink); font-weight: 600; }
        article a { color: var(--sand); text-decoration-color: rgba(244, 207, 152, 0.4); }

        /* The byline sits directly under the title as a lone bold line. */
        article > p:first-of-type strong { font-weight: 500; }

        article hr {
            border: 0;
            border-top: 1px solid var(--hair);
            margin: 44px 0;
        }
        /* Section rules already come from the h2 border. */
        article hr + h2 { border-top: 0; padding-top: 0; margin-top: 0; }

        article ul { padding-left: 20px; margin: 0 0 18px; }
        article li { margin-bottom: 10px; }

        /* ---------- Statement callouts (markdown blockquotes) ---------- */
        article blockquote {
            margin: 26px 0;
            padding: 20px 24px;
            background: var(--card);
            border: 1px solid var(--hair);
            border-left: 2px solid var(--sand);
        }
        article blockquote > :last-child { margin-bottom: 0; }
        article blockquote strong { color: var(--sand); }

        /* ---------- Proofs ---------- */
        article details {
            margin: 0 0 26px;
            padding: 0 0 0 18px;
            border-left: 1px solid var(--line);
        }
        article details[open] { padding-bottom: 4px; }
        article summary {
            cursor: pointer;
            font-family: 'Martian Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--faint);
            list-style: none;
            padding: 6px 0;
            transition: color 0.15s ease;
        }
        article summary:hover { color: var(--sand); }
        article summary::-webkit-details-marker { display: none; }
        article summary i { font-style: normal; }
        article summary::before {
            content: '+ ';
            color: var(--sand);
        }
        article details[open] summary::before { content: '\2212  '; }

        /* ---------- Figures ---------- */
        article p[align="center"] {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: center;
            gap: 22px;
            margin: 30px 0 10px;
        }
        article p[align="center"] img {
            height: 150px;
            width: auto;
            border: 1px solid var(--hair);
        }
        article sub {
            display: block;
            text-align: center;
            font-size: 12.5px;
            line-height: 1.5;
            color: var(--faint);
            margin-bottom: 30px;
        }

        /* ---------- Table ---------- */
        .table-wrap {
            overflow-x: auto;
            margin: 26px 0;
            border: 1px solid var(--hair);
        }
        article table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }
        article th, article td {
            text-align: left;
            padding: 11px 16px;
            border-bottom: 1px solid var(--hair);
            white-space: nowrap;
        }
        article th {
            font-family: 'Martian Mono', monospace;
            font-size: 9.5px;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink);
            background: var(--card);
        }
        /* Header case folding must not reach the maths: (a,b,c) is not (A,B,C). */
        article th .katex { text-transform: none; letter-spacing: normal; }
        article tbody tr:last-child td { border-bottom: 0; }

        /* ---------- Math ---------- */
        .katex { font-size: 1.04em; }
        .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding: 6px 2px;
            margin: 22px 0;
        }
        article code {
            font-family: 'Martian Mono', monospace;
            font-size: 0.85em;
            color: var(--sand);
        }

        /* ---------- Status ---------- */
        .status {
            font-family: 'Martian Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--faint);
        }

        @media (max-width: 640px) {
            .wrap { padding: 36px 20px 90px; }
            article p[align="center"] { gap: 14px; }
            article p[align="center"] img { height: 108px; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/">&larr;&nbsp;&nbsp;Thomas Y.L. Lin</a>
        </div>
    </nav>

    <div class="wrap">
        <article id="doc">
            <p class="status">Rendering&hellip;</p>
        </article>
        <noscript>
            <p class="status">This page renders with JavaScript.
            <a href="swallowtail_theorem.md">Read the source (Markdown)</a>.</p>
        </noscript>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>

    <script>
        // Markdown eats LaTeX (\; and \, are CommonMark escapes, and blockquote
        // markers leak into $$ blocks), so pull every formula out first, run the
        // markdown, then drop KaTeX back into the holes.
        const MATH = [];

        function liftDisplayMath(src) {
            const lines = src.split('\n');
            const out = [];
            const fence = /^(\s*(?:>\s?)*)\$\$\s*$/;
            for (let i = 0; i < lines.length; i++) {
                const open = lines[i].match(fence);
                if (!open) { out.push(lines[i]); continue; }
                const body = [];
                i++;
                while (i < lines.length && !fence.test(lines[i])) {
                    // Drop one level of "> " so quoted formulas survive.
                    body.push(lines[i].replace(/^\s*>\s?/, ''));
                    i++;
                }
                MATH.push({ tex: body.join('\n').trim(), display: true });
                out.push(open[1] + '@@M' + (MATH.length - 1) + '@@');
            }
            return out.join('\n');
        }

        function liftInlineMath(src) {
            return src.replace(/\$([^$\n]+?)\$/g, (_, tex) => {
                MATH.push({ tex: tex.trim(), display: false });
                return '@@M' + (MATH.length - 1) + '@@';
            });
        }

        function typeset(html) {
            // Unwrap display math that markdown parked inside its own <p>.
            html = html.replace(/<p>\s*@@M(\d+)@@\s*<\/p>/g, (m, i) =>
                MATH[+i] && MATH[+i].display ? render(+i) : m);
            return html.replace(/@@M(\d+)@@/g, (m, i) => render(+i));
        }

        function render(i) {
            const node = MATH[i];
            if (!node) return '';
            try {
                return katex.renderToString(node.tex, {
                    displayMode: node.display,
                    throwOnError: false,
                    strict: false
                });
            } catch (err) {
                return '<code>' + node.tex.replace(/</g, '&lt;') + '</code>';
            }
        }

        function wrapTables(root) {
            root.querySelectorAll('table').forEach(table => {
                const box = document.createElement('div');
                box.className = 'table-wrap';
                table.parentNode.insertBefore(box, table);
                box.appendChild(table);
            });
        }

        async function build() {
            const target = document.getElementById('doc');
            let source;
            try {
                const res = await fetch('swallowtail_theorem.md', { cache: 'no-cache' });
                if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
                source = await res.text();
            } catch (err) {
                target.innerHTML = '<p class="status">Could not load the document (' +
                    String(err.message || err).replace(/</g, '&lt;') +
                    '). <a href="swallowtail_theorem.md">Read the Markdown source</a>.</p>';
                return;
            }

            const lifted = liftInlineMath(liftDisplayMath(source));
            target.innerHTML = typeset(marked.parse(lifted));
            wrapTables(target);
            document.title = (target.querySelector('h1')?.textContent.trim() ||
                'Why Swallowtail') + ' | Thomas Y.L. Lin';
        }

        window.addEventListener('load', build);
    </script>
</body>
</html>
